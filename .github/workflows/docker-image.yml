name: docker-image

# 云端构建多架构镜像并推送到 GitHub Container Registry（ghcr.io/aidotnet/ark）
# 使用内置 GITHUB_TOKEN 推送，无需在仓库配置任何 Docker Hub secrets
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/docker-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/aidotnet/ark:latest
            ghcr.io/aidotnet/ark:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
