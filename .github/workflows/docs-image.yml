name: docs-image

# 文档站独立镜像并推送到 Docker Hub（hejiale010426/ark-docs），与主镜像 ark 分开构建
# 需要在仓库 Settings → Secrets and variables → Actions 配置：
#   DOCKERHUB_USERNAME — Docker Hub 用户名
#   DOCKERHUB_TOKEN    — Docker Hub Access Token（Account Settings → Security → Personal access tokens）
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs-image.yml"
  workflow_dispatch:

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./docs
          file: docs/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            hejiale010426/ark-docs:latest
            hejiale010426/ark-docs:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
